name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[A-Za-z ]*' | sed -E 's/ +$//')
          echo "Simulator: $DEVICE"
          status=0
          xcodebuild test \
            -project HorseDash.xcodeproj \
            -scheme HorseDash \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST)" build.log || true
          if [ $status -ne 0 ]; then tail -n 80 build.log; fi
          exit $status
