
name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[A-Za-z ]*' | sed -E 's/ +$//')
          echo "Simulator: $DEVICE"

          xcodebuild test \
            -project HorseDash.xcodeproj \
            -scheme HorseDash \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build simulator app
        run: |
          xcodebuild build \
            -project HorseDash.xcodeproj \
            -scheme HorseDash \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/HorseDash-Simulator.zip" HorseDash.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: HorseDash-Simulator
          path: HorseDash-Simulator.zip
          retention-days: 7
